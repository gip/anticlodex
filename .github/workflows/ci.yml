name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Invoked per-package rather than via `pnpm test`, whose `pretest` hook
      # shells out to the `openship` CLI that is not installed on the runner.
      - name: Test
        run: pnpm --filter @acx/api --filter @acx/ui test

      - name: Build api
        run: pnpm build:api

      - name: Build web
        run: pnpm build:web

      - name: Build desktop
        run: pnpm build:desktop
